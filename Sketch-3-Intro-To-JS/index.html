<!DOCTYPE html>
<html lang="en-US">
  <head>
    <meta name="author" content="Abdul Nofal">
    <title>Intro To JS</title>
    <style>
      #ball {
        border-radius: 50%;
        height: 120px;
        width: 120px;
        position: absolute;
        background: magenta;
        box-shadow: 10px 10px #9E0B8F;
      }
    </style>
  </head>
  <body>
    <div id="ball"></div>
  </body>
  <script>
    let nameObj = "Ball";
    let speed = 5;
    let moving = true;
    
    let x = 0;
    let y = 0;
    let dx = speed;
    let dy = speed;
        
    function moveBall() {
      if(moving) {
        x += dx;
        y += dy;
        
        if(x <= 0 || x >= window.innerWidth - 130) {
          dx = -dx;
        }
        if(y <= 0 || y >= window.innerHeight - 130) {
          dy = -dy;
        }
        
        ball.style.left = x + "px";
        ball.style.top = y + "px";
      }
    }
    
    moveBall();
    setInterval(moveBall, 20);
  </script>
</html>
