<!DOCTYPE html>
<html lang="en-US">
  <head>
    <title>Flexbox</title>
    <meta name="author" content="Abdul Nofal">
    <meta name="description" content="Flexbox">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      
      .menu {
        display: flex;
        justify-content: space-around;
      }
      
      .menu > a {
        color: green;
        font-family: sans-serif;
        font-size: 24px;
        text-decoration: none;
      }
      
      .menu > a:hover {
        color: hsl(160, 70%, 50%);
        border-bottom: 2px solid hsl(160, 70%, 50%);
      }
      
      @media (max-width: 400px) {
        .menu {
          flex-direction: column;
          align-items: center;
        }
      }
    
    </style>
  </head>
  <body>
    <nav class="menu">
      <a href="#">music</a>
      <a href="#">photos</a>
      <a href="#">videos</a>
      <a href="#">texts</a>
    </nav>
  </body>
</html>
